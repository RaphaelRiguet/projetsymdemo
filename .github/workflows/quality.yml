name: quality du code
on:
  push:
    branches: 
    - main
    - develop
  pull_request:
    branches:
        - develop

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v7
            - name: Récupérer le cache Composer
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
            
            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: '8.5'
                extensions: mbstring, intl

            - name: Mise en cache du Composer
              uses: actions/cache@v6
              with:
                path: ${{ steps.composer-cache.outputs.dir }}
                key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: ${{ runner.os }}-composer-

            - name: Installer les dépendances Composer
              run: composer install --no-progress --no-interaction --prefer-dist
            
            - name: Lancer l'audit de sécurité
              run: composer audit

            - name: verification du style avec php cs-fixer
              run: vendor/bin/php-cs-fixer fix --dry-run --diff
            - name: analise statique avec phpStan
              run: vendor /bin/phpstan analyse -c phpstan.dist.neon --noprogress 
            - name: linter twig 
              run: bin/console lint:twig templates/
            - name: linter yaml 
              run: bin/console lint:yaml config/
            - name: linter les controleur de services
              run: bin/console lint:container config/
            - name: linter les container de services
              run: bin/console lint:container --no-debug
            - name: verification des entiter doquerin
              run: bin/console doctrine:schema:validate

            jobs:
                test-integration:
                    runs-on: ubuntu-latest
                    services:
                        mysql:
                            image: mysql:8.0
                            env:
                                MYSQL_ROOT_PASSWORD: testpass
                                MYSQL_DATABASE: testdb
                            ports:
                                - 3306:3306
                            options:
                                --health-cmd="mysqladmin ping --silent"
                                --health-interval=10s
                                --health-timeout=5s
                                --health-retries=3
                            env:
                                DATABASE_URL: mysql://root:testpass@127.0.1:3306/testdb
                                APP_ENV: test
                        name: Récupérer le dépôt
                          uses: actions/checkout@v7
                        name: Récupérer le cache Composer
                        id: composer-cache
                        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
                      name: Installer PHP
                        uses: shivammathur/setup-php@v2
                        with:
                            php-version: '8.5'
                            extensions: mbstring, intl
                      name: Mise en cache
                    uses: actions/cache@v6
                    with:
                      path: ${{ steps.composer-cache.outputs.dir }}
                      key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                      restore-keys: ${{ runner.os }}-composer-
                      name: Installer les dépendances Composer
                      run: composer install --no-progress --no-interaction --prefer-dist
                        - name: installer les dépendances composer
                        run: composer install --no-progress --no-interaction --prefer-dist
                        - name: crée la base de donées
                            run: 
                                bin/console doctrine:database:create --nointeraction
                                if-not-exists
                                php bin/console doctrine:schema:create   --no-interaction
                        - name: charger les fixtures
                          run: bin/console doctrine:fixtures:load --no-interaction
